[project]
name = "delhi-causelist"
version = "0.1.0"
description = "Fetch Delhi, Odisha, Telangana, Bombay, and Madhya Pradesh High Court cause lists."
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "google-cloud-storage>=2.18",
    "google-cloud-tasks>=2.26.0",
    "httpx>=0.27",
    "pymongo>=4.18.3",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
all-causelist = "all_causelist.__main__:main"
delhi-causelist = "all_causelist.__main__:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["all_causelist"]
